<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A self-hosted GitHub pull request review bot powered by OpenCodeReview.">
    <title>GitHub PR Review Bot</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.6; }
      body { max-width: 44rem; margin: 0 auto; padding: 4rem 1.5rem; }
      h1 { line-height: 1.2; }
      a { color: #0969da; }
      @media (prefers-color-scheme: dark) { a { color: #80b9ff; } }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHub PR Review Bot</h1>
      <p>A small, self-hosted bot that reviews pull requests with
        <a href="https://github.com/alibaba/open-code-review">OpenCodeReview</a>
        and posts findings as GitHub review comments.</p>
      <p><a href="https://github.com/alex-heritier/review-bot">View the source and setup instructions on GitHub →</a></p>
    </main>
  </body>
</html>
